name: Atualizar cobrinha

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cobrinha.yml"

permissions:
  contents: write

jobs:
  gerar-cobrinha:
    name: Gerar animação das contribuições
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Gerar versões clara e escura
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/cobrinha.svg?color_snake=purple
            dist/cobrinha-escura.svg?palette=github-dark&color_snake=purple

      - name: Salvar animações na branch output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
